{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReViveCare — Rehabilitation Progress & Side Lateral Raise</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-teal: #00A8A8;
            --primary-teal-dark: #008B8B;
            --deep-navy: #1E3A5F;
            --bg-soft: #F8FBFC;
            --text-dark: #1E3A5F;
            --text-muted: #64748B;
            --gradient-brand: linear-gradient(135deg, #00A8A8 0%, #008B8B 50%, #1E3A5F 100%);
            --gradient-teal: linear-gradient(135deg, #00A8A8 0%, #008B8B 100%);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-soft);
            color: var(--text-dark);
            min-height: 100vh;
        }

        header {
            background: var(--gradient-brand);
            color: white;
            padding: 0.95rem 0;
            box-shadow: 0 4px 20px rgba(30, 58, 95, 0.18);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 0.55rem 1.35rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .back-btn:hover {
            background: white;
            color: var(--deep-navy);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .exercise-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
            justify-content: center;
        }

        .video-section {
            flex-shrink: 0;
        }

        .video-container {
            position: relative;
            background: #0F233C;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(30, 58, 95, 0.18);
            border: 2px solid rgba(0, 168, 168, 0.3);
            width: 360px;
            height: 640px;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .dashboard-panel {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 16px 40px rgba(30, 58, 95, 0.08);
            border: 1px solid rgba(0, 168, 168, 0.14);
            width: 660px;
            flex-shrink: 0;
        }

        .dashboard-panel h2 {
            color: var(--deep-navy);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.45rem;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.75rem;
        }

        .stat-card {
            background: #F8FBFC;
            border-radius: 16px;
            padding: 1.1rem;
            text-align: center;
            border: 1px solid #E2E8F0;
            transition: all 0.25s ease;
        }

        .stat-card.excellent { border-bottom: 4px solid #10B981; }
        .stat-card.good { border-bottom: 4px solid #0EA5E9; }
        .stat-card.partial { border-bottom: 4px solid #F59E0B; }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--deep-navy);
        }

        .stat-card.excellent .stat-value { color: #10B981; }
        .stat-card.good .stat-value { color: #0EA5E9; }
        .stat-card.partial .stat-value { color: #F59E0B; }

        .graph-container {
            background: #F8FBFC;
            border-radius: 18px;
            padding: 1.25rem;
            margin-bottom: 1.75rem;
            height: 360px;
            border: 1px solid #E2E8F0;
        }

        .start-btn {
            background: var(--gradient-teal);
            color: white;
            border: none;
            padding: 1.15rem;
            font-size: 1.05rem;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 168, 168, 0.32);
            width: 100%;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 168, 168, 0.42);
        }

        @media (max-width: 1080px) {
            .exercise-layout {
                flex-direction: column;
                align-items: center;
            }
            .dashboard-panel {
                width: 100%;
                max-width: 660px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <div class="logo-icon"><i class="fi fi-sr-heart-pulse"></i></div>
                <span>ReViveCare</span>
            </div>
            <a href="{% url 'exercise' %}" class="back-btn">
                <i class="fi fi-rr-arrow-small-left"></i> Back to Exercises
            </a>
        </nav>
    </header>

    <div class="container">
        <div class="exercise-layout">
            <div class="video-section">
                <div class="video-container">
                    <video id="exerciseVideo" autoplay loop muted playsinline>
                        <source src="{% static 'Patients/videos/sl.mp4' %}" type="video/mp4">
                    </video>
                </div>
            </div>

            <div class="dashboard-panel">
                <h2><i class="fi fi-sr-chart-histogram" style="color: var(--primary-teal);"></i> Side Lateral Raise & Rehab Telemetry</h2>

                <div class="stats-summary">
                    <div class="stat-card excellent">
                        <div class="stat-label">Excellent Reps (★)</div>
                        <div class="stat-value" id="totalExcellent">0</div>
                    </div>
                    <div class="stat-card good">
                        <div class="stat-label">Good Reps (✓)</div>
                        <div class="stat-value" id="totalGood">0</div>
                    </div>
                    <div class="stat-card partial">
                        <div class="stat-label">Partial Reps (!)</div>
                        <div class="stat-value" id="totalPartial">0</div>
                    </div>
                </div>

                <div class="graph-container">
                    <canvas id="progressChart"></canvas>
                </div>

                <div class="action-button">
                    <a href="{% url 'srtwo' %}" style="text-decoration: none;">
                        <button class="start-btn">
                            <i class="fi fi-sr-camera"></i> Launch AI Pose Studio (Side Lateral Raise)
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const workoutData = {{ workout_data|safe }};

        const dates = workoutData.map(session => {
            const date = new Date(session.date);
            const label = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            return session.exercise_type ? `${label} (${session.exercise_type.split(' ')[0]})` : label;
        });

        const excellentReps = workoutData.map(session => session.excellent_reps);
        const goodReps = workoutData.map(session => session.good_reps);
        const partialReps = workoutData.map(session => session.partial_reps);

        document.getElementById('totalExcellent').textContent = excellentReps.reduce((s, v) => s + v, 0);
        document.getElementById('totalGood').textContent = goodReps.reduce((s, v) => s + v, 0);
        document.getElementById('totalPartial').textContent = partialReps.reduce((s, v) => s + v, 0);

        const ctx = document.getElementById('progressChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Excellent Reps',
                        data: excellentReps,
                        borderColor: '#10B981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5
                    },
                    {
                        label: 'Good Reps',
                        data: goodReps,
                        borderColor: '#0EA5E9',
                        backgroundColor: 'rgba(14, 165, 233, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5
                    },
                    {
                        label: 'Partial Reps',
                        data: partialReps,
                        borderColor: '#F59E0B',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' }
                },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 4 } }
                }
            }
        });
    </script>
</body>
</html>
